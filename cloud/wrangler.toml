name = "campusmail-ai-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron: every minute, pump due emails
[triggers]
crons = ["* * * * *"]

# D1 database (created with: wrangler d1 create relay_db)
[[d1_databases]]
binding = "DB"
database_name = "campusmail-ai-relay-db"
database_id = "b879fb0a-26c9-4959-9f03-9dd42aa54e54"

# R2 bucket for large email bodies (created with: wrangler r2 bucket create campusmail-ai-bodies)
[[r2_buckets]]
binding = "BODIES"
bucket_name = "campusmail-ai-bodies"
